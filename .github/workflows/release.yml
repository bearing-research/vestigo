name: Release

# A `v*` tag runs the suite, builds the wheel and sdist and attests their provenance,
# smoke-tests the wheel on Linux, macOS and Windows, publishes to TestPyPI via OIDC
# trusted publishing, then to PyPI after manual approval on the protected `pypi`
# environment (PEP 740 attestations by default), then attaches the same files to a
# GitHub release.
#
# Trusted publishers must exist on PyPI and TestPyPI (Owner: bearing-research,
# Repo: vestigo, Workflow: release.yml, Environment: testpypi / pypi).

on:
  push:
    tags:
      - 'v*'
  # Re-publish without re-tagging after a transient publish failure.
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.1.0). Required on manual runs."
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - name: The tag, pyproject.toml and CHANGELOG.md must agree
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              version = os.environ["DISPATCH_VERSION"]
          else:
              version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with open("pyproject.toml", "rb") as f:
              declared = tomllib.load(f)["project"]["version"]
          if declared != version:
              print(f"::error::tag {version!r} does not match pyproject.toml version {declared!r}")
              sys.exit(1)
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          if not re.search(rf"^##\s+{re.escape(version)}(?:\s|$)", changelog, re.MULTILINE):
              print(f"::error::CHANGELOG.md has no '## {version}' section")
              sys.exit(1)
          print(f"releasing {version}")
          PY

  # The tag publishes only what passes the suite, whatever CI said about the commit.
  test:
    name: Test the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          version: "0.13.1"
      - run: uv sync --all-extras --locked
      - run: uv run pytest -q -p no:cacheprovider
        env:
          VESTIGO_REQUIRE_DOCKER: "1"

  build:
    name: Build and attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          version: "0.13.1"
      - run: uv build --out-dir dist
      # Build provenance for the files PyPI and the GitHub release both carry:
      # `gh attestation verify <file> -R bearing-research/vestigo`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # The one wheel, installed from the files the build made, on every OS the package
  # supports: the core with no extra, then the adapter with its extra on CPU torch.
  smoke:
    name: Smoke-test the wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          version: "0.13.1"
      - name: Import the core and the adapter
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/vestigo-*-py3-none-any.whl | head -1)
          uv run --isolated --no-project --with "${WHEEL}" python -c "
          from vestigo import checkpoint_files
          from vestigo.build_store import BuildStore
          from vestigo.releases import ReleaseStore
          from vestigo.sql_backend import SqliteDialect
          from vestigo.store import ArtifactStore
          print('vestigo imports ok')
          "
          # CPU torch from its index first, then PyPI for the rest.
          uv run --isolated --no-project --index https://download.pytorch.org/whl/cpu \
            --with "${WHEEL}[torch]" python -c "
          import vestigo.torch
          print('vestigo.torch imports ok')
          "

  testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vestigo
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Lets a workflow_dispatch re-run finish after a partial failure.
          skip-existing: true

  # The `pypi` environment needs a required reviewer; this job waits for
  # "Approve and deploy" in the run UI.
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: testpypi
    environment:
      name: pypi
      url: https://pypi.org/p/vestigo
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          skip-existing: true

  # After PyPI's approval: the same files, attested at build, as a GitHub release whose
  # notes are the version's CHANGELOG section.
  github:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the release, or add the files to it on a re-run
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = workflow_dispatch ]; then VERSION="${DISPATCH_VERSION}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          VERSION="${VERSION}" python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          section = re.search(rf"^##\s+{re.escape(version)}\b.*?\n(.*?)(?=^##\s|\Z)", text, re.M | re.S)
          open("notes.md", "w", encoding="utf-8").write(section.group(1).strip() + "\n")
          PY
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "v${VERSION}" dist/* --verify-tag --title "vestigo ${VERSION}" \
              --notes-file notes.md --repo "${GITHUB_REPOSITORY}"
          fi
