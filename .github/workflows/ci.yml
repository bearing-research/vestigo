name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          version: "0.13.1"
      # ty resolves the extras' SDKs through the project venv, torch's (CPU) included.
      - run: uv sync --all-extras --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
      # Every check but the test suite lives in .pre-commit-config.yaml.
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure --color=always

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        # The oldest and newest Python on macOS (arm64) and Windows (x64). Neither runner
        # runs Linux containers (no nested virtualization on macOS; Windows containers on
        # Windows), so the Postgres and object-store tests skip there and run on Linux.
        include:
          - {os: macos-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.14"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.13.1"
      - run: uv sync --all-extras --no-extra torch --locked

      # The ledger stands on its own: nothing of its first consumer may be
      # installed, or a test could pass by reaching into it.
      - name: Assert Strata is absent
        run: |
          uv run python - <<'PY'
          import importlib.util
          for mod in ("strata", "strata_client", "fastapi", "pyiceberg", "duckdb"):
              assert importlib.util.find_spec(mod) is None, f"{mod} unexpectedly installed"
          PY

      # The Postgres suite starts a container through Docker on the Linux runner;
      # without a daemon it fails there rather than skipping to green.
      # The torch adapter's tests have their own job.
      - run: uv run pytest -v -p no:cacheprovider --ignore=tests/test_torch.py
        env:
          VESTIGO_REQUIRE_DOCKER: ${{ runner.os == 'Linux' && '1' || '' }}

  torch:
    name: Tests (torch, ${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest Python the package supports, on Linux with the containers;
        # macOS and Windows on the oldest, their ledgers on SQLite and local disk.
        os: [ubuntu-latest]
        python-version: ["3.12", "3.14"]
        include:
          - {os: macos-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.13.1"
      # CPU torch, from the index pyproject.toml names for it; Postgres and the three
      # object stores (their emulators, in Docker) for the ledgers the adapter writes to.
      - run: uv sync --extra torch --extra sign --extra postgres --extra s3 --extra gcs --extra azure --locked
      # The macOS runner's hostname does not resolve promptly: gloo bound to its address,
      # which the ranks could not reach, and torchrun's getfqdn() hung before any rank ran.
      - if: runner.os == 'macOS'
        run: |
          echo "GLOO_SOCKET_IFNAME=lo0" >> "$GITHUB_ENV"
          echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
      - run: uv run pytest -v -p no:cacheprovider tests/test_torch.py
        env:
          VESTIGO_REQUIRE_DOCKER: ${{ runner.os == 'Linux' && '1' || '' }}
