\* Two BuildRunners and a lease that can expire mid-build.
\* Only the invariant it shows violated is listed: given several, TLC reports
\* whichever violation a worker finds first.
CONSTANTS
    Runners = {r1, r2}
    Executors = {}
    MaxEpoch = 3
    Patched = FALSE
SPECIFICATION Spec
INVARIANTS OnlyLeaseHolderFails
